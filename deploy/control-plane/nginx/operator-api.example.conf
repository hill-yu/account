# This virtual host is the only public entry point for operator APIs.
# Keep the FastAPI listener on 127.0.0.1 (or a private container network).
# Copy operator-token.conf.example to an access-restricted include file and set
# the same value as ADX_COLLECTOR_OPERATOR_API_TOKEN in the API service.

server {
    listen 443 ssl http2;
    server_name control.example.com;

    include /etc/nginx/conf.d/operator-token.conf;

    location ^~ /api/v1/operator/ {
        auth_basic "ADX operator";
        auth_basic_user_file /etc/nginx/.htpasswd-adx-operator;

        proxy_set_header X-ADX-Operator-Token $adx_operator_token;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://127.0.0.1:8000;
    }

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://127.0.0.1:8000;
    }
}
